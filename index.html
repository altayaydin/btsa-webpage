<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Title and description are set per page by the route `head` options. These
         og: tags are what link previews (WhatsApp, Instagram) see, since they don't run JS. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BocconiTSA — Turkish Students at Bocconi" />
    <meta
      property="og:description"
      content="Events calendar, recaps and community for Turkish students in Milan."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
